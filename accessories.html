<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bullz Eye Billiards Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/products.css" />
  <style>
    .acc-hero{padding-top:60px;padding-bottom:40px;text-align:center}
    .acc-categories{padding:20px 0 60px;background:var(--bg)}
    .acc-circles-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:2rem 1.75rem}
    .acc-circle-item{display:flex;flex-direction:column;align-items:center;gap:.85rem;cursor:pointer;transition:transform .25s}
    .acc-circle-item:hover{transform:translateY(-6px)}
    .acc-circle-item:hover .acc-circle{border-color:var(--gold);box-shadow:0 0 22px rgba(212,168,67,.35)}
    .acc-circle-item:hover .acc-circle-label{color:var(--gold)}
    .acc-circle-item.active .acc-circle{border-color:var(--gold);box-shadow:0 0 28px rgba(212,168,67,.5)}
    .acc-circle-item.active .acc-circle-label{color:var(--gold);font-weight:600}
    .acc-circle{width:110px;height:110px;border-radius:50%;border:2px solid var(--border);background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:border-color .3s,box-shadow .3s}
    .acc-circle img{width:100%;height:100%;object-fit:cover;transition:transform .5s;background:#111}
    .acc-circle-item:hover .acc-circle img{transform:scale(1.1)}
    .acc-circle-label{font-family:var(--font-sans);font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;max-width:110px;transition:color .25s;line-height:1.3}
    /* Detail panel */
    .acc-detail-panel{padding:0 0 100px;display:none}
    .acc-detail-panel.visible{display:block;animation:panelIn .45s ease forwards}
    .acc-panel-header{text-align:center;margin-bottom:3rem;padding:50px 0 0;border-top:1px solid var(--border)}
    .acc-panel-header .panel-eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.75rem}
    .acc-panel-header h2{font-family:var(--font-serif);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:var(--text);margin-bottom:.75rem}
    .acc-panel-header p{color:var(--muted);font-size:.95rem;max-width:520px;margin:0 auto;line-height:1.7}
    @keyframes panelIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .product-spec-table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.82rem}
    .product-spec-table tr:nth-child(even){background:rgba(255,255,255,.04)}
    .product-spec-table td{padding:.45rem .6rem;border:1px solid var(--border);color:var(--muted);vertical-align:top}
    .product-spec-table td:first-child{font-weight:600;color:var(--text);white-space:nowrap;width:38%}
    .product-price{font-size:1.1rem;font-weight:700;color:var(--gold);margin:.75rem 0 .5rem}
    /* Product card image */
    .product-card-img{position:relative;overflow:hidden}
    .product-card-img img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#111;transition:transform .5s ease}
    .product-card:hover .product-card-img img{transform:scale(1.05)}
    .product-card-img .product-badge{position:absolute;top:10px;right:10px;z-index:10}
    /* Gallery card */
    .acc-gallery-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;cursor:pointer;transition:border-color .25s,transform .25s,box-shadow .25s}
    .acc-gallery-card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 8px 24px rgba(212,168,67,.15)}
    .acc-gallery-card-img{aspect-ratio:1/1;overflow:hidden}
    .acc-gallery-card-img img{width:100%;height:100%;object-fit:cover;display:block;background:#111;transition:transform .5s ease}
    .acc-gallery-card:hover .acc-gallery-card-img img{transform:scale(1.06)}
    .acc-gallery-card-label{padding:.6rem .5rem;font-family:var(--font-sans);font-size:.68rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;border-top:1px solid var(--border);transition:color .25s}
    .acc-gallery-card:hover .acc-gallery-card-label{color:var(--gold)}
    /* View All */
    .view-all-section{padding:10px 0 60px;background:var(--bg)}
    .view-all-toggle{display:flex;justify-content:center;margin-bottom:2.5rem}
    .btn-view-all{display:inline-flex;align-items:center;gap:.6rem;padding:.75rem 2rem;border:1px solid var(--gold);color:var(--gold);font-family:var(--font-sans);font-size:.78rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;background:transparent;cursor:pointer;transition:background .25s,color .25s;border-radius:2px}
    .btn-view-all:hover{background:var(--gold);color:#000}
    .btn-view-all .arrow{display:inline-block;transition:transform .3s}
    .btn-view-all.open .arrow{transform:rotate(180deg)}
    .all-acc-gallery{display:none}
    .all-acc-gallery.visible{display:block;animation:panelIn .4s ease forwards}
    .gallery-cat-block{margin-bottom:3rem}
    .gallery-cat-heading{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}
    .gallery-cat-heading .eyebrow{font-size:.65rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
    .gallery-cat-heading h3{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;color:var(--text);margin:0}
    .acc-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem}
    @media(max-width:600px){
      .acc-circle{width:80px;height:80px}.acc-circle-label{font-size:.68rem;max-width:80px}
      .acc-circles-wrap{gap:1.5rem 1rem}.acc-gallery-grid{grid-template-columns:repeat(2,1fr);gap:.6rem}
    }
  </style>
</head>

const ORDER = ['spider','railing','cuecover','glove','chalk','cuestick','ballset','cloth'];
const LABELS = {
  spider:'Snooker<br>Plastic Spider', railing:'Snooker<br>Railing Set',
  cuecover:'Snooker<br>Cue Cover',   glove:'Snooker<br>Table Glove',
  chalk:'Billiard<br>Chalk',         cuestick:'Cue<br>Stick',
  ballset:'Snooker<br>Ball Set',     cloth:'Snooker<br>Table Cloth'
};

let currentCat = null;

// Build circles
(function(){
  document.getElementById('circlesWrap').innerHTML = ORDER.map(cat => {
    const d = DATA[cat];
    return `<div class="acc-circle-item" data-cat="${cat}" onclick="selectCategory(this)">
      <div class="acc-circle"><img src="${d.circleImg}" alt="${d.title}" loading="lazy" /></div>
      <span class="acc-circle-label">${LABELS[cat]}</span>
    </div>`;
  }).join('');
})();

// Build gallery lazily
function buildGallery(){
  let html = '';
  for(const cat of ORDER){
    const d = DATA[cat];
    html += `<div class="gallery-cat-block">
      <div class="gallery-cat-heading"><span class="eyebrow">${d.eyebrow}</span><h3>${d.title}</h3></div>
      <div class="acc-gallery-grid">`;
    d.products.forEach(p => {
      html += `<div class="acc-gallery-card" onclick="selectCategoryByKey('${cat}')">
        <div class="acc-gallery-card-img"><img src="${p.img}" alt="${p.name}" loading="lazy" /></div>
        <div class="acc-gallery-card-label">${p.name}</div>
      </div>`;
    });
    html += `</div></div>`;
  }
  document.getElementById('allAccGallery').innerHTML = html;
}

function toggleViewAll(btn){
  const g = document.getElementById('allAccGallery');
  const open = g.classList.contains('visible');
  if(!open && !g.innerHTML) buildGallery();
  g.classList.toggle('visible', !open);
  btn.classList.toggle('open', !open);
  btn.querySelector('.arrow').textContent = open ? '▼' : '▲';
  if(!open) setTimeout(() => g.scrollIntoView({behavior:'smooth', block:'start'}), 100);
}

function selectCategoryByKey(cat){
  const el = document.querySelector(`.acc-circle-item[data-cat="${cat}"]`);
  if(el){
    selectCategory(el);
    document.getElementById('allAccGallery').classList.remove('visible');
    const btn = document.getElementById('viewAllBtn');
    btn.classList.remove('open'); btn.querySelector('.arrow').textContent = '▼';
  }
}

function buildSpecTable(specs){
  return `<table class="product-spec-table">${specs.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
}

function buildCard(p){
  return `<article class="product-card reveal" style="opacity:0;transform:translateY(20px)">
    <div class="product-card-img">
      <img src="${p.img}" alt="${p.name}" loading="lazy" />
      <span class="product-badge">${p.badge}</span>
    </div>
    <div class="product-card-body">
      <h3>${p.name}</h3>
      <div class="product-price">${p.price}</div>
      <p class="desc">${p.desc}</p>
      ${buildSpecTable(p.specs)}
      <a href="https://wa.me/919876543210?text=Hi%20Bullz%20Eye!%20Quote%20for%20${p.wa.replace(/\+/g,'%20')}." target="_blank" class="btn-product-quote">Request Quote</a>
    </div>
  </article>`;
}

function selectCategory(el){
  const cat = el.dataset.cat;
  if(currentCat === cat){
    currentCat = null;
    document.querySelectorAll('.acc-circle-item').forEach(c => c.classList.remove('active'));
    const panel = document.getElementById('acc-detail-panel');
    panel.style.animation = 'none'; panel.classList.remove('visible'); return;
  }
  currentCat = cat;
  document.querySelectorAll('.acc-circle-item').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const d = DATA[cat]; if(!d) return;
  document.getElementById('acc-panel-header').innerHTML = `
    <p class="panel-eyebrow">${d.eyebrow}</p><h2>${d.title}</h2><p>${d.desc}</p>`;
  const grid = document.getElementById('acc-product-grid');
  grid.innerHTML = d.products.map(p => buildCard(p)).join('');
  const panel = document.getElementById('acc-detail-panel');
  panel.classList.remove('visible'); void panel.offsetWidth; panel.classList.add('visible');
  setTimeout(() => {
    grid.querySelectorAll('.product-card').forEach((card, i) => {
      setTimeout(() => {
        card.style.transition = 'opacity .5s ease,transform .5s ease';
        card.style.opacity = '1'; card.style.transform = 'translateY(0)';
      }, i * 120);
    });
  }, 80);
  setTimeout(() => panel.scrollIntoView({behavior:'smooth', block:'start'}), 100);
}
</script>
</body>
</html>
